name: Validate pull request

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.165.0"
          extended: true

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache Hugo resources
        uses: actions/cache@v5
        with:
          path: resources/_gen
          key: hugo-resources-${{ runner.os }}-${{ hashFiles('config/_default/**', 'go.mod', 'go.sum', 'content/**', 'assets/**') }}
          restore-keys: |
            hugo-resources-${{ runner.os }}-

      - name: Download Hugo modules
        run: go mod download

      - name: Install quality tools
        run: npm ci

      - name: Install validation tools
        run: |
          pipx install yamllint
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash -s -- latest "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run quality gates
        run: .github/scripts/validate-quality.sh

      - name: Publish validation summary
        if: always()
        run: |
          {
            echo '## Pull request validation'
            echo ''
            echo '- Markdown lint'
            echo '- YAML lint and GitHub Actions syntax'
            echo '- Hugo module-aware production build'
            echo '- Generated-site link check'
          } >> "$GITHUB_STEP_SUMMARY"
