baseURL: "https://example.github.io/"
locale: "en-US"
defaultContentLanguage: "en"
timezone: "Asia/Shanghai"
title: "Personal Technical Blog"
description: "A professional technical blog covering cloud architecture, infrastructure, DevOps, security, and AI engineering."
enableRobotsTXT: true
enableGitInfo: false
enableEmoji: true

build:
  writeStats: true

markup:
  goldmark:
    renderer:
      unsafe: false
  highlight:
    noClasses: false

taxonomies:
  category: categories
  tag: tags

outputs:
  home:
    - HTML
    - RSS

permalinks:
  posts: "/posts/:slug/"

minify:
  minifyOutput: true
