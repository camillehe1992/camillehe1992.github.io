baseURL: "https://example.github.io/"
locale: "en-US"
defaultContentLanguage: "en"
timezone: "Asia/Shanghai"
title: "Camille He | Cloud Engineering Portfolio"
description: "Cloud engineering notes and portfolio work covering AWS, Terraform, DevOps, security, and AI engineering."
enableRobotsTXT: true
enableGitInfo: false
enableEmoji: true

build:
  writeStats: true

markup:
  goldmark:
    renderer:
      unsafe: false
  highlight:
    noClasses: false

taxonomies:
  category: categories
  tag: tags

params:
  author: "Camille He"
  authorEmail: ""
  authorBio: "Cloud and DevOps engineer focused on reliable infrastructure, automation, and practical AI engineering."
  authorLocation: ""

outputs:
  home:
    - HTML
    - RSS

permalinks:
  posts: "/posts/:slug/"

minify:
  minifyOutput: true
